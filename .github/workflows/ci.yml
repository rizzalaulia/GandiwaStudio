name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository structure, links, and obvious secrets
        run: python3 scripts/verify_repository.py
      - name: Check whitespace
        run: git diff --check
