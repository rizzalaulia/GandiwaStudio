name: CI

on:
  push:
    branches:
      - main
      - "feat/issue-**"
      - "fix/issue-**"
      - "docs/issue-**"
      - "refactor/issue-**"
      - "test/issue-**"
      - "ci/issue-**"
      - "chore/issue-**"
  pull_request:

permissions:
  contents: read

jobs:
  kanban-policy:
    name: Kanban policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify deterministic kanban policy
        run: python3 -m unittest tests/kanban/test_kanban_flow.py -v

  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify repository structure, links, and obvious secrets
        run: python3 scripts/verify_repository.py
      - name: Check whitespace
        run: git diff --check
