name: CI

on:
  push:
    branches:
      - main
      - "feat/issue-**"
      - "fix/issue-**"
      - "docs/issue-**"
      - "refactor/issue-**"
      - "test/issue-**"
      - "ci/issue-**"
      - "chore/issue-**"
  pull_request:

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm through Corepack
        run: corepack enable
      - name: Install frontend workspace from lockfile
        run: corepack pnpm install --frozen-lockfile
      - name: Build workspace contracts for frontend consumers
        run: corepack pnpm --filter @gandiwa/contracts build
      - name: Lint frontend
        run: corepack pnpm --filter @gandiwa/web lint
      - name: Typecheck frontend
        run: corepack pnpm --filter @gandiwa/web typecheck
      - name: Test frontend
        run: corepack pnpm --filter @gandiwa/web test
      - name: Build frontend production bundle
        run: corepack pnpm --filter @gandiwa/web build
      - name: Verify cross-language project manifest fixtures
        run: corepack pnpm --filter @gandiwa/contracts test

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Install backend environment from lockfile
        run: uv sync --locked --project apps/api --group dev
      - name: Lint backend
        run: uv run --project apps/api ruff check apps/api/src apps/api/tests
      - name: Typecheck backend
        run: uv run --project apps/api mypy apps/api/src
      - name: Test backend without warnings
        run: uv run --project apps/api pytest apps/api/tests -W error

  migration-check:
    name: Clean database migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Install backend environment from lockfile
        run: uv sync --locked --project apps/api --group dev
      - name: Upgrade a clean temporary SQLite database to head
        env:
          GANDIWA_DATABASE_URL: sqlite:///${{ runner.temp }}/gandiwa-ci.sqlite3
          GANDIWA_ARTIFACT_DIR: ${{ runner.temp }}/gandiwa-ci-artifacts
        run: uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
      - name: Confirm exactly the expected migration head
        env:
          GANDIWA_DATABASE_URL: sqlite:///${{ runner.temp }}/gandiwa-ci.sqlite3
          GANDIWA_ARTIFACT_DIR: ${{ runner.temp }}/gandiwa-ci-artifacts
        run: |
          uv run --project apps/api alembic -c apps/api/alembic.ini current | grep -Fxq '0001 (head)'

  ci-workflow-contract:
    name: CI workflow contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify CI workflow contract
        run: python3 -m unittest tests/ci/test_ci_workflow_contract.py -v

  kanban-policy:
    name: Kanban policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify deterministic kanban policy
        run: python3 -m unittest tests/kanban/test_kanban_flow.py -v

  repository-contract:
    name: Repository contract and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify repository structure, links, and obvious secrets
        run: python3 scripts/verify_repository.py
      - name: Check whitespace
        run: git diff --check
